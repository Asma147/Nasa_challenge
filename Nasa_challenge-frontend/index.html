
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Earth Jukebox</title>

    <!-- Main styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="accessibility.css?v=6">
    <link rel="stylesheet" href="space-extra.css?v=1">

    <!-- Zoom and floating video preview -->
    <link rel="stylesheet" href="zoom.css?v=1">
</head>

<body>

    <!-- Animated space background -->
    <div id="space-bg" aria-hidden="true">

        <div class="space-stars"></div>

        <div class="bg-twinkle bg-twinkle-a"></div>
        <div class="bg-twinkle bg-twinkle-b"></div>

        <i class="bg-meteor m1"></i>
        <i class="bg-meteor m2"></i>
        <i class="bg-meteor m3"></i>
        <i class="bg-meteor m4"></i>

        <i class="bg-comet"></i>
        <i class="bg-sat"></i>

    </div>

    <!-- Entry screen -->
    <div id="gate"
         role="dialog"
         aria-modal="true"
         aria-labelledby="gate-title"
         hidden>

        <div class="gate-bg" aria-hidden="true">

            <div class="gate-stars"></div>

            <div class="gate-orbit">

                <span class="gate-ring"></span>
                <span class="gate-ring"></span>
                <span class="gate-ring"></span>
                <span class="gate-ring"></span>

                <div class="gate-planet"></div>

            </div>

        </div>

        <div class="gate-card">

            <h2 id="gate-title">Earth Jukebox</h2>

            <p class="gate-tag">
                Hear the planet change.
            </p>

            <p id="gate-text"
               class="gate-note"
               hidden>
            </p>

            <div class="gate-actions">

                <button id="gate-voice" type="button">
                    Voice mode <span>(Enter)</span>
                </button>

                <button id="gate-normal" type="button">
                    Continue normally <span>(Esc)</span>
                </button>

            </div>

        </div>

    </div>

    <!-- Header -->
    <header>

        <button id="back-to-start" type="button">
            &larr; Back to start
        </button>

        <h1>Earth Jukebox</h1>

        <p>Hear the planet change.</p>

    </header>

    <!-- Main application -->
    <main>

        <!-- Interactive Earth globe -->
        <div
            id="globe"
            role="img"
            aria-label="Interactive 3D globe showing the selected visualization. All its functions are also available with the buttons."
        ></div>

        <!-- Controls panel -->
        <aside>

            <!-- Visualization filters -->
            <h2>Visualizations</h2>

            <div
                id="filters"
                role="group"
                aria-label="Choose a visualization">
            </div>

            <p id="description" aria-live="polite">
                Choose a visualization to hear it.
            </p>

            <!-- Regions -->
            <h2>Regions</h2>

            <div
                id="regions"
                role="group"
                aria-label="Choose a region">
            </div>

            <!-- Custom area selection -->
            <h2>Custom area</h2>

            <button
                id="select"
                type="button"
                aria-pressed="false">
                Select an area
            </button>

            <p class="hint">
                Mouse or touch only. With a keyboard, use the regions above.
            </p>

            <!-- Status -->
            <p id="status" aria-live="polite"></p>

            <!-- Audio controls -->
            <button id="pause" type="button" hidden>
                Pause sound
            </button>

        </aside>

    </main>

    <!-- Globe library -->
    <script src="https://unpkg.com/globe.gl"></script>

    <!-- Zoom module -->
    <script src="zoom.js?v=1"></script>

    <!-- Main application -->
    <script src="app.js"></script>

    <!-- Accessibility -->
    <script src="accessibility.js?v=6"></script>

    <!-- Audio player -->
    <script src="player.js?v=1"></script>

</body>
</html>
