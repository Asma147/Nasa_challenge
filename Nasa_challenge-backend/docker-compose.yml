
services:
  project:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: earthsense-backend

    ports:
      - "8000:8000"

    volumes:
      - ./resources:/data:ro

    environment:
      MAX_JOBS: "2"
      QUEUE_TIMEOUT: "5"
      MEDIA_DIR: /data
      CORS_ORIGINS: "*"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
